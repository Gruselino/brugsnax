<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snack Bar Wishlist</title>
<style>
  :root { --fg:#222; --muted:#777; --line:#ddd; --accent:#1a73e8; --bg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --muted:#999; --line:#444; --accent:#8ab4f8; --bg:#1b1b1b; } }
  body { font: 15px/1.4 system-ui, sans-serif; color:var(--fg); background:var(--bg); max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4em; margin:0 0 12px; }
  input, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #suggest { display:flex; gap:6px; margin-bottom:8px; }
  #suggest input { flex:1; }
  #candidates { list-style:none; padding:0; margin:0 0 12px; border:1px solid var(--line); border-radius:4px; }
  #candidates:empty { display:none; }
  #candidates li { display:flex; align-items:center; gap:10px; padding:6px 10px; border-bottom:1px solid var(--line); cursor:pointer; }
  #candidates li:last-child { border-bottom:0; }
  #candidates li:hover { background:rgba(128,128,128,.12); }
  #candidates img { width:36px; height:36px; object-fit:contain; }
  .brand { color:var(--muted); font-size:.9em; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-weight:600; color:var(--muted); font-size:.85em; }
  td.n { text-align:right; white-space:nowrap; }
  td img { width:32px; height:32px; object-fit:contain; margin-right:6px; vertical-align:middle; }
  .vote { min-width:64px; }
  .vote.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .price { cursor:pointer; text-decoration:underline dotted; }
  .price.none { color:var(--muted); }
  .del { border:0; background:none; color:var(--muted); font-size:1.1em; padding:2px 6px; }
  #total { margin-top:12px; font-size:1.15em; font-weight:600; }
  #hint, #status { color:var(--muted); font-size:.9em; }
  #setup { border:1px solid #c33; padding:10px; border-radius:4px; }
  #setup code { background:rgba(128,128,128,.15); padding:1px 4px; }
  #me { float:right; font-size:.9em; }
  #me input { width:120px; padding:3px 6px; }
</style>
</head>
<body>
<label id="me">Your name <input id="name" placeholder="optional"></label>
<h1>🍫 Snack Bar Wishlist</h1>

<div id="setup" hidden>
  <b>Not configured yet.</b> Copy your Firebase web config into <code>firebase-config.js</code> (see README.md).
</div>

<form id="suggest">
  <input id="query" placeholder="Suggest a snack, e.g. pretzel m&m" autocomplete="off" required>
  <button class="primary" id="find">Find</button>
</form>
<ul id="candidates"></ul>
<div id="status"></div>

<table>
  <thead><tr><th>Snack</th><th class="n">Votes</th><th class="n">Price</th><th></th></tr></thead>
  <tbody id="list"></tbody>
</table>
<div id="total"></div>
<div id="hint">Click a price to correct it. Prices are crowd‑sourced averages from Open Prices (EUR); items without a price count as 0 in the total.</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => n == null ? "—" : n.toFixed(2).replace(".", ",") + " €";

// ---- identity (per browser) ----
const clientId = localStorage.clientId || (localStorage.clientId = Math.random().toString(36).slice(2) + Date.now().toString(36));
$("#name").value = localStorage.name || "";
$("#name").onchange = e => localStorage.name = e.target.value.trim();

// ---- firebase ----
if (!firebaseConfig || !firebaseConfig.databaseURL || /YOUR_/.test(firebaseConfig.databaseURL)) {
  $("#setup").hidden = false;
  throw new Error("firebase-config.js not filled in");
}
const db = getDatabase(initializeApp(firebaseConfig));
let items = {}, votes = {};
onValue(ref(db, "items"), s => { items = s.val() || {}; render(); });
onValue(ref(db, "votes"), s => { votes = s.val() || {}; render(); });

// ---- render ----
function render() {
  const rows = Object.entries(items).map(([id, it]) => ({ id, ...it, n: Object.keys(votes[id] || {}).length }))
    .sort((a, b) => b.n - a.n || a.created - b.created);
  $("#list").innerHTML = rows.map(r => `
    <tr data-id="${r.id}">
      <td>${r.image ? `<img src="${esc(r.image)}" alt="">` : ""}${esc(r.name)}
        <div class="brand">${esc([r.brand, r.quantity].filter(Boolean).join(" · "))}${r.addedBy ? ` · by ${esc(r.addedBy)}` : ""}</div></td>
      <td class="n"><button class="vote ${votes[r.id]?.[clientId] ? "on" : ""}" data-act="vote">👍 ${r.n}</button></td>
      <td class="n"><span class="price ${r.price == null ? "none" : ""}" data-act="price" title="${r.priceNote ? esc(r.priceNote) : "click to set"}">${eur(r.price)}</span></td>
      <td class="n"><button class="del" data-act="del" title="Remove">×</button></td>
    </tr>`).join("");
  const sum = rows.reduce((a, r) => a + (r.price || 0), 0);
  const missing = rows.filter(r => r.price == null).length;
  $("#total").textContent = rows.length ? `Total: ${eur(sum)} for ${rows.length} item${rows.length > 1 ? "s" : ""}${missing ? ` (${missing} without price)` : ""}` : "No suggestions yet.";
}

$("#list").onclick = e => {
  const act = e.target.dataset.act; if (!act) return;
  const id = e.target.closest("tr").dataset.id;
  if (act === "vote") {
    const r = ref(db, `votes/${id}/${clientId}`);
    votes[id]?.[clientId] ? remove(r) : set(r, true);
  } else if (act === "price") {
    const v = prompt(`Price in € for "${items[id].name}"`, items[id].price ?? "");
    if (v === null) return;
    const p = parseFloat(v.replace(",", "."));
    update(ref(db, `items/${id}`), { price: isNaN(p) ? null : Math.round(p * 100) / 100, priceNote: isNaN(p) ? null : "set manually" });
  } else if (act === "del") {
    if (confirm(`Remove "${items[id].name}"?`)) update(ref(db), { [`items/${id}`]: null, [`votes/${id}`]: null });
  }
};

// ---- lookup: Open Food Facts ----
const FIELDS = "code,product_name,product_name_de,product_name_en,brands,quantity,image_small_url,image_url";
const pick = v => typeof v === "object" && v ? (v.de || v.en || v.main || Object.values(v)[0]) : v;
const norm = p => ({
  code: p.code, name: pick(p.product_name_de) || pick(p.product_name) || pick(p.product_name_en) || "",
  brand: Array.isArray(p.brands) ? p.brands[0] : (p.brands || "").split(",")[0].trim(),
  quantity: p.quantity || "", image: p.image_small_url || p.image_url || ""
});
async function searchOFF(q) {
  // Classic search first: it sends CORS headers, so browsers can call it. The newer
  // search-a-licious endpoint currently doesn't, so it's only a fallback.
  const tries = [
    `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=6&fields=${FIELDS}`,
    `https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&langs=de,en&page_size=6&fields=${FIELDS}`
  ];
  for (const url of tries) {
    try {
      const d = await (await fetch(url)).json();
      const list = (d.hits || d.products || []).map(norm).filter(p => p.name);
      if (list.length) return list;
    } catch {}
  }
  return [];
}

// ---- lookup: Open Prices (average EUR) ----
async function avgPrice(code) {
  if (!code) return null;
  try {
    const d = await (await fetch(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${code}&currency=EUR&size=50&order_by=-date`)).json();
    const ps = (d.items || []).map(p => +p.price).filter(p => p > 0);
    if (!ps.length) return null;
    const avg = ps.reduce((a, b) => a + b, 0) / ps.length;
    return { price: Math.round(avg * 100) / 100, note: `average of ${ps.length} price${ps.length > 1 ? "s" : ""} on Open Prices` };
  } catch { return null; }
}

// ---- suggest flow ----
$("#suggest").onsubmit = async e => {
  e.preventDefault();
  const q = $("#query").value.trim(); if (!q) return;
  $("#find").disabled = true; $("#status").textContent = "Searching…"; $("#candidates").innerHTML = "";
  const found = await searchOFF(q);
  $("#find").disabled = false; $("#status").textContent = found.length ? "Pick the one you mean:" : "Nothing matched.";
  $("#candidates").innerHTML = found.map((p, i) => `
    <li data-i="${i}">${p.image ? `<img src="${esc(p.image)}" alt="">` : "<span style='width:36px'></span>"}
      <span>${esc(p.name)}<div class="brand">${esc([p.brand, p.quantity].filter(Boolean).join(" · "))}</div></span></li>`).join("")
    + `<li data-i="-1"><span style="width:36px"></span><span>Add “${esc(q)}” as typed (no price lookup)</span></li>`;
  $("#candidates").onclick = async ev => {
    const li = ev.target.closest("li"); if (!li) return;
    const i = +li.dataset.i;
    const p = i >= 0 ? found[i] : { name: q, brand: "", quantity: "", code: "", image: "" };
    $("#candidates").innerHTML = ""; $("#status").textContent = "Looking up price…";
    const pr = await avgPrice(p.code);
    await set(push(ref(db, "items")), {
      name: p.name, brand: p.brand, quantity: p.quantity, code: p.code, image: p.image,
      price: pr?.price ?? null, priceNote: pr?.note ?? null,
      addedBy: localStorage.name || null, created: Date.now()
    });
    $("#status").textContent = pr ? "Added with an average price." : "Added — no price found, click “—” to set one.";
    $("#query").value = "";
  };
};
</script>
</body>
</html>
